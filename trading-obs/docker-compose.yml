# Local stack. With Supabase you don't need the `db` service: put your
# Supabase connection string in .env as DATABASE_URL and run
#   docker compose up api worker
#
# Local Postgres instead:  docker compose --profile localdb up
services:
  db:
    profiles: ["localdb"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kerno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kerno
    ports:
      - "127.0.0.1:5432:5432"   # never exposed beyond this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kerno"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: ["kerno", "init-db"]

  worker:
    build: .
    env_file: .env
    command: ["kerno", "run-all"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
